add_newline = false

format = """$directory$git_branch$git_worktree$character"""

[directory]
truncation_length = 2
truncate_to_repo = false
style = "white"

[git_branch]
format = "[$symbol $branch ]($style)"
symbol = ""
style = "white"
truncation_length = 9
truncation_symbol = "…"

[character]
success_symbol = "❯"
error_symbol = "❯"
