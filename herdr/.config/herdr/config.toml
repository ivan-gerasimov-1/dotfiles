onboarding = false

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[theme]
name = "gruvbox"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[keys]
prefix = "cmd+k"

new_workspace = "cmd+n"
new_tab = "cmd+t"
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
switch_tab = "cmd+1..9"
switch_workspace = "ctrl+1..9"
next_tab = "cmd+]"
previous_tab = "cmd+["

focus_pane_left = "cmd+alt+h"
focus_pane_down = "cmd+alt+j"
focus_pane_up = "cmd+alt+k"
focus_pane_right = "cmd+alt+l"

resize_pane_left = "cmd+ctrl+h"
resize_pane_down = "cmd+ctrl+j"
resize_pane_up = "cmd+ctrl+k"
resize_pane_right = "cmd+ctrl+l"

zoom = "cmd+enter"
close_workspace = "cmd+shift+w"
toggle_sidebar = "cmd+b"

rename_tab = "cmd+r"
rename_workspace = "cmd+shift+r"
rename_pane = "cmd+alt+r"

clear_pane = "prefix+k"

[[keys.command]]
key = "cmd+w"
type = "shell"
command = "python3 ${XDG_CONFIG_HOME:-$HOME/.config}/herdr/scripts/cmd-w.py"
