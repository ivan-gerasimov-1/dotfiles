promptToReturnFromSubprocess: false
os:
  editPreset: nvim
git:
  diffRenderers:
    - colorArg: always
      command: >-
        delta --paging=never --line-numbers --hyperlinks --minus-style="syntax #3a3030" --minus-emph-style="syntax #4a332d" --plus-style="syntax #333532" --plus-emph-style="syntax #3d4038" --hunk-header-style="syntax #3a3637" --file-style="bold #dedede" --line-numbers-minus-style="#da5b2c" --line-numbers-plus-style="#cacaca" --line-numbers-zero-style="#7f7f7f"
gui:
  showIcons: false
  mouseEvents: true
  sidePanelWidth: 0.18
  expandFocusedSidePanel: true
  showCommandLog: false
  showPanelJumps: false
  theme:
    activeBorderColor:
      - "#5d595b"
    inactiveBorderColor:
      - "#5d595b"
    searchingActiveBorderColor:
      - "#da5b2c"
    optionsTextColor:
      - "#989898"
    selectedLineBgColor:
      - "#3a3637"
    cherryPickedCommitBgColor:
      - "#3a3637"
    cherryPickedCommitFgColor:
      - "#cacaca"
    unstagedChangesColor:
      - "#da5b2c"
    defaultFgColor:
      - "#dedede"
customCommands:
  - key: "O"
    context: "localBranches"
    command: "gh pr view --web"
    description: "Open PR in browser"
